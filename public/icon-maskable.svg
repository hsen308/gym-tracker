<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gym Tracker">
  <!-- Maskable: Android crops this to a circle, squircle or rounded square
       of its choosing, so everything meaningful stays inside the middle 80%.
       Full-bleed background, artwork inset well clear of the edges. -->
  <rect width="512" height="512" fill="#1B44D8"/>

  <rect x="146" y="358" width="220" height="8" rx="4" fill="#FFFFFF" opacity="0.38"/>

  <rect x="150" y="286" width="56" height="62"  rx="11" fill="#FFFFFF" opacity="0.55"/>
  <rect x="228" y="238" width="56" height="110" rx="11" fill="#FFFFFF" opacity="0.78"/>
  <rect x="306" y="176" width="56" height="172" rx="11" fill="#FFFFFF"/>
</svg>
