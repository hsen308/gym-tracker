<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gym Tracker">
  <!-- Ballpoint blue, the app's primary colour. A light icon washes out
       among saturated ones on a home screen; this reads at 48px. -->
  <rect width="512" height="512" rx="114" fill="#1B44D8"/>

  <!-- The baseline rule that runs through every screen in the app. Bars are
       measured AGAINST something, which is what separates this from a
       generic chart glyph. -->
  <rect x="104" y="386" width="304" height="10" rx="5" fill="#FFFFFF" opacity="0.38"/>

  <!-- Ascending bars: the adherence sparkline, which is the one element that
       actually says what this app is for. Three, not five — at icon size
       anything thinner turns to mush. -->
  <rect x="112" y="286" width="76" height="86"  rx="14" fill="#FFFFFF" opacity="0.55"/>
  <rect x="218" y="216" width="76" height="156" rx="14" fill="#FFFFFF" opacity="0.78"/>
  <rect x="324" y="122" width="76" height="250" rx="14" fill="#FFFFFF"/>
</svg>
